name: Daily Mutual Fund Data Refresh

on:
  schedule:
    # Runs daily at 18:00 UTC (11:30 PM IST, after AMFI publishes daily NAVs)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Indian Mutual Funds, Index Funds & NSE ETFs
        run: |
          python3 scripts/fetch_funds.py
          python3 scripts/fetch_etfs.py
          mkdir -p docs/data
          cp data/funds_master.json docs/data/funds_master.json
          cp data/etfs_master.json docs/data/etfs_master.json

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funds_master.json docs/data/funds_master.json data/etfs_master.json docs/data/etfs_master.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily refresh of Indian Mutual Funds & NSE ETFs datasets"
            git push
          fi
